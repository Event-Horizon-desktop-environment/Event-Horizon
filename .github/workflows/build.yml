name: build

# Manual-only: runs only when you trigger it from the Actions tab
# (workflow_dispatch). Pushes and pull requests do NOT build.
on:
  workflow_dispatch:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build with Nix flake (dev env)
        run: nix develop --command zig build -Doptimize=ReleaseFast
      - name: Show built binaries
        run: ls -la zig-out/bin || true
