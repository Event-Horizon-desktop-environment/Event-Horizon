name: Linux packages

# Manual-only: nothing runs unless you trigger it from the Actions tab
# (workflow_dispatch). Branch pushes, tag pushes and pull requests do NOT
# build. Run it once with release=false for a plain build+test, or with
# release=true to publish a stable release using the version in src/version.zig.
#
# Packages are built with fpm from one Zig ReleaseFast build. CI binaries target
# x86-64-v2 for portability; the local build script may target the current CPU.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish stable release using version from src/version.zig'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: build + test (Fedora 44)
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      # Fedora images ship without git, which actions/checkout requires.
      - name: Install git for checkout
        run: dnf -y install git
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          set -euo pipefail
          dnf -y install git pkgconf-pkg-config curl xz tar gzip \
            wayland-devel wayland-protocols-devel \
            cairo-devel pango-devel libxkbcommon-devel \
            librsvg2-devel libwebp-devel pipewire-devel
      - name: Build, test, and stage install
        run: |
          set -euo pipefail
          # The build script downloads Zig 0.16.0 when the distro version is
          # missing or too old, and builds ReleaseFast for portable x86-64-v2.
          ./build.sh --skip-deps --cpu v2 --no-install

          # Use the script-downloaded Zig when it had to bootstrap one;
          # otherwise use the system Zig that passed build.sh's version check.
          if [ -x "$HOME/.cache/event-horizon/zig-0.16.0/zig" ]; then
            ZIG_BIN="$HOME/.cache/event-horizon/zig-0.16.0/zig"
          else
            ZIG_BIN="$(command -v zig)"
          fi

          "$ZIG_BIN" build test
          rm -rf staging dist
          mkdir -p dist
          DESTDIR="$PWD/staging" "$ZIG_BIN" build install --prefix=/usr
          DESTDIR="$PWD/staging" "$ZIG_BIN" build install-icons --prefix=/usr/share

          VERSION="$(sed -n 's/^[[:space:]]*pub const string = "\([^"]*\)";/\1/p' src/version.zig)"
          test -n "$VERSION"
          echo "$VERSION" > dist/VERSION
          echo "build version: $VERSION"
          ls staging
      - uses: actions/upload-artifact@v5
        with:
          name: staging
          path: |
            staging/
            dist/VERSION

  deb:
    name: deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: staging
          path: pkg
      - name: Install fpm
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install --no-document fpm
      - name: Pack deb
        run: |
          set -euo pipefail
          VERSION="$(cat pkg/dist/VERSION)"
          mkdir -p dist
          fpm -s dir -t deb -n event-horizon-de -v "$VERSION" \
            --architecture amd64 \
            --description "Event Horizon Desktop Environment" \
            --license "MIT" \
            --url "https://github.com/Event-Horizon-desktop-environment/Event-Horizon" \
            -C pkg/staging -p "dist/event-horizon-de_${VERSION}_amd64.deb"
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: deb
          path: dist/*.deb

  rpm:
    name: rpm (Fedora 44)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: staging
          path: pkg
      - name: Install fpm
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential rpm
          sudo gem install --no-document fpm
      - name: Pack rpm
        # RPM versions must not contain '-': 0.1.0-beta2 -> 0.1.0_beta2.
        run: |
          set -euo pipefail
          VERSION="$(cat pkg/dist/VERSION)"
          SAFE_VERSION="${VERSION//-/_}"
          mkdir -p dist
          fpm -s dir -t rpm -n event-horizon-de -v "$SAFE_VERSION" \
            --iteration 1 --architecture x86_64 \
            --description "Event Horizon Desktop Environment" \
            --license "MIT" \
            --url "https://github.com/Event-Horizon-desktop-environment/Event-Horizon" \
            -C pkg/staging -p "dist/event-horizon-de-${SAFE_VERSION}-1.x86_64.rpm"
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    name: pacman package (Arch)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: staging
          path: pkg
      - name: Install fpm
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential zstd libarchive-tools
          sudo gem install --no-document fpm
      - name: Pack pacman package
        # Pacman pkgver must not contain '-': 0.1.0-beta2 -> 0.1.0_beta2.
        run: |
          set -euo pipefail
          VERSION="$(cat pkg/dist/VERSION)"
          SAFE_VERSION="${VERSION//-/_}"
          mkdir -p dist
          fpm -s dir -t pacman --pacman-compression zstd \
            --name event-horizon-de --version "$SAFE_VERSION" \
            --iteration 1 --architecture x86_64 \
            --description "Event Horizon Desktop Environment" \
            --license "MIT" \
            --url "https://github.com/Event-Horizon-desktop-environment/Event-Horizon" \
            --depends wayland,cairo,pango,freetype2,fontconfig,libxkbcommon,pipewire,libwebp,hicolor-icon-theme \
            -C pkg/staging -p "dist/event-horizon-de-${SAFE_VERSION}-1-x86_64.pkg.tar.zst"
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  tarball:
    name: portable tarball
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: staging
          path: pkg
      - name: Pack tarball
        run: |
          set -euo pipefail
          VERSION="$(cat pkg/dist/VERSION)"
          mkdir -p dist
          tar -czf "dist/event-horizon-de-${VERSION}-x86_64.tar.gz" -C pkg/staging usr
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: tarball
          path: dist/*.tar.gz

  release:
    name: publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [deb, rpm, arch, tarball]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve version and ensure tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="$(sed -n 's/^[[:space:]]*pub const string = "\([^"]*\)";/\1/p' src/version.zig)"
            test -n "$VERSION"
            TAG="$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release $TAG (version $VERSION)"
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              echo "Tag $TAG already exists, reusing it."
            else
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "$TAG"
            fi
          fi
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: false
          make_latest: true
          files: dist/event-horizon-de*
          fail_on_unmatched_files: true
          generate_release_notes: true
