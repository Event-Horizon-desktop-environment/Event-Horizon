# Generated by Event Horizon

# Palette
set -gq @event-horizon_surface "{{ colors.surface.default.hex }}"
set -gq @event-horizon_on_surface "{{ colors.on_surface.default.hex }}"
set -gq @event-horizon_surface_container_low "{{ colors.surface_container_low.default.hex }}"
set -gq @event-horizon_surface_container "{{ colors.surface_container.default.hex }}"
set -gq @event-horizon_surface_container_high "{{ colors.surface_container_high.default.hex }}"
set -gq @event-horizon_surface_container_highest "{{ colors.surface_container_highest.default.hex }}"
set -gq @event-horizon_on_surface_variant "{{ colors.on_surface_variant.default.hex }}"
set -gq @event-horizon_outline "{{ colors.outline.default.hex }}"
set -gq @event-horizon_outline_variant "{{ colors.outline_variant.default.hex }}"
set -gq @event-horizon_primary "{{ colors.primary.default.hex }}"
set -gq @event-horizon_on_primary "{{ colors.on_primary.default.hex }}"
set -gq @event-horizon_primary_container "{{ colors.primary_container.default.hex }}"
set -gq @event-horizon_on_primary_container "{{ colors.on_primary_container.default.hex }}"
set -gq @event-horizon_secondary_container "{{ colors.secondary_container.default.hex }}"
set -gq @event-horizon_on_secondary_container "{{ colors.on_secondary_container.default.hex }}"
set -gq @event-horizon_tertiary_container "{{ colors.tertiary_container.default.hex }}"
set -gq @event-horizon_on_tertiary_container "{{ colors.on_tertiary_container.default.hex }}"
set -gq @event-horizon_error_container "{{ colors.error_container.default.hex }}"
set -gq @event-horizon_on_error_container "{{ colors.on_error_container.default.hex }}"

# Styles
set -gqF status-style "bg=#{@event-horizon_surface_container_low},fg=#{@event-horizon_on_surface}"
if-shell -F '#{==:#{@event-horizon_inactive_tabs_use_background},off}' \
  'set -gqF window-status-style "fg=#{@event-horizon_on_surface_variant}"' \
  'set -gqF window-status-style "bg=#{@event-horizon_surface_container},fg=#{@event-horizon_on_surface_variant}"'
set -gqF window-status-current-style "bg=#{@event-horizon_surface_container_highest},fg=#{@event-horizon_on_surface},bold"
set -gqF window-status-last-style "fg=#{@event-horizon_on_surface},bold"
set -gqF window-status-activity-style "bg=#{@event-horizon_tertiary_container},fg=#{@event-horizon_on_tertiary_container}"
set -gqF window-status-bell-style "bg=#{@event-horizon_error_container},fg=#{@event-horizon_on_error_container},bold"
set -gqF pane-border-style "fg=#{@event-horizon_outline_variant}"
set -gqF pane-active-border-style "fg=#{@event-horizon_primary}"
set -gqF mode-style "bg=#{@event-horizon_secondary_container},fg=#{@event-horizon_on_secondary_container},bold"
set -gqF message-style "bg=#{@event-horizon_primary_container},fg=#{@event-horizon_on_primary_container}"
set -gqF message-command-style "bg=#{@event-horizon_primary_container},fg=#{@event-horizon_on_primary_container}"
set -gqF popup-style "bg=#{@event-horizon_surface},fg=#{@event-horizon_on_surface}"
set -gqF popup-border-style "fg=#{@event-horizon_outline}"
set -gqF menu-style "bg=#{@event-horizon_surface_container_high},fg=#{@event-horizon_on_surface}"
set -gqF menu-selected-style "bg=#{@event-horizon_primary},fg=#{@event-horizon_on_primary},bold"
set -gqF menu-border-style "fg=#{@event-horizon_outline}"
set -gqF copy-mode-match-style "bg=#{@event-horizon_tertiary_container},fg=#{@event-horizon_on_tertiary_container}"
set -gqF copy-mode-current-match-style "bg=#{@event-horizon_primary_container},fg=#{@event-horizon_on_primary_container},bold"
set -gqF copy-mode-selection-style "bg=#{@event-horizon_secondary_container},fg=#{@event-horizon_on_secondary_container}"
set -gqF clock-mode-colour "#{@event-horizon_primary}"
