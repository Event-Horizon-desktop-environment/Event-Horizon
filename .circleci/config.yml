version: 2.1

# Manual-only: this pipeline is gated behind the `run_ci` parameter, which
# defaults to false, so ordinary pushes build nothing. To run it, trigger a
# pipeline from the CircleCI UI (set run_ci to true) or via the API:
#   curl -u $TOKEN: -X POST https://circleci.com/api/v2/project/<vcs>/<org>/<repo>/pipeline \
#     -d '{"parameters":{"run_ci":true}}'
parameters:
  run_ci:
    type: boolean
    default: false
    description: Build packages. Leave false for pushes; set true to run CI by hand.

executors:
  fedora:
    docker:
      - image: fedora:44

commands:
  install-deps:
    steps:
      - run:
          name: Install dependencies
          # Same set as build.sh's Fedora list. Zig itself is fetched by
          # build.sh (0.16.0+), not taken from dnf.
          command: |
            dnf install -y \
              git pkgconf-pkg-config curl xz tar gzip \
              wayland-devel wayland-protocols-devel \
              cairo-devel pango-devel libxkbcommon-devel \
              librsvg2-devel libwebp-devel pipewire-devel

jobs:
  build:
    executor: fedora
    steps:
      - run:
          name: Install git and ssh
          command: dnf install -y git openssh-clients tar gzip
      - checkout
      - run:
          name: Initialize submodules
          command: git submodule sync && git submodule update --init --recursive --depth 1
      - install-deps
      - run:
          name: Build (ReleaseFast, x86-64-v2)
          environment:
            CPATH: /usr/include
          command: ./build.sh --skip-deps --cpu v2 --no-install
      - run:
          name: Test and stage install
          environment:
            CPATH: /usr/include
          command: |
            set -euo pipefail
            if [ -x "$HOME/.cache/event-horizon/zig-0.16.0/zig" ]; then
              ZIG_BIN="$HOME/.cache/event-horizon/zig-0.16.0/zig"
            else
              ZIG_BIN="$(command -v zig)"
            fi
            "$ZIG_BIN" build test
            rm -rf staging
            DESTDIR="$PWD/staging" "$ZIG_BIN" build install --prefix=/usr
            DESTDIR="$PWD/staging" "$ZIG_BIN" build install-icons --prefix=/usr/share
            sed -n 's/^[[:space:]]*pub const string = "\([^"]*\)";/\1/p' src/version.zig > .version
            test -s .version
      - persist_to_workspace:
          root: .
          paths:
            - staging
            - .version

  package-arch:
    executor: fedora
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install fpm
          command: |
            dnf install -y ruby ruby-devel zstd bsdtar
            gem install --no-document fpm
      - run:
          name: Create Arch packages
          command: |
            VER=$(cat .version); VER="${VER//-/_}"
            mkdir -p packages
            fpm -s dir -t pacman --pacman-compression zstd \
              --name event-horizon-de --version "$VER" --iteration 1 --architecture x86_64 \
              --description "Event Horizon Desktop Environment" \
              --license "MIT" \
              --url "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" \
              --depends wayland,cairo,pango,freetype2,fontconfig,libxkbcommon,pipewire,libwebp,hicolor-icon-theme \
              -C staging -p "packages/event-horizon-de-${VER}-1-x86_64.pkg.tar.zst"
      - store_artifacts:
          path: packages
          destination: arch

  package-debian:
    docker:
      - image: ubuntu:24.04
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install fpm
          command: |
            apt-get update && apt-get install -y ruby-full binutils liblz4-dev
            gem install --no-document fpm
      - run:
          name: Create Debian packages
          command: |
            VER=$(cat .version); VER="${VER//-/_}"
            mkdir -p packages
            fpm -s dir -t deb -n event-horizon-de -v "$VER" --architecture amd64 \
              -C staging -p "packages/event-horizon-de_${VER}_amd64.deb"
      - store_artifacts:
          path: packages
          destination: debian

  package-rpm:
    executor: fedora
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install fpm
          command: |
            dnf install -y ruby ruby-devel rpm-build
            gem install --no-document fpm
      - run:
          name: Create RPM packages
          command: |
            VER=$(cat .version); VER="${VER//-/_}"
            mkdir -p packages
            fpm -s dir -t rpm -n event-horizon-de -v "$VER" --architecture x86_64 \
              -C staging -p "packages/event-horizon-de-${VER}-1.x86_64.rpm"
      - store_artifacts:
          path: packages
          destination: rpm

workflows:
  build-and-package:
    when: << pipeline.parameters.run_ci >>
    jobs:
      - build
      - package-arch:
          requires: [build]
      - package-debian:
          requires: [build]
      - package-rpm:
          requires: [build]
